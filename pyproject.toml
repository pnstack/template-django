[project]
name = "template-django"
version = "0.1.0"
description = "Django REST API template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "djoser>=2.3",
    "django-cors-headers>=4.7",
    "django-filter>=25.1",
    "django-environ>=0.12",
    "drf-spectacular>=0.28",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.4",
    "pytest-django>=4.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apps.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
